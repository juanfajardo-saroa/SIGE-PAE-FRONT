<div fxLayout="row wrap">
  <div fxFlex="100">
    <mat-card>
      <mat-card-content>
        <div class="table-responsive">
          <div style="width: 100%; float: right;">
            <div class="titletable">ZonaETC</div>
          </div>
          <table mat-table [dataSource]="dataSource" class="left-radius" matSort>
            
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef  style="padding-left: 0px; "><b>N°</b> </th>
              <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;"> {{element.id}}
              </td>
            </ng-container>
            
            <ng-container matColumnDef="siD_ETC">
              <th mat-header-cell *matHeaderCellDef  style="padding-left: 0px; "> <b>E T C</b></th>
              <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;"> {{element.sID_ETC}}
              </td>
            </ng-container>
           
            <ng-container matColumnDef="siD_CentroAcopio">
              <th mat-header-cell *matHeaderCellDef  style="padding-left: 0px; "><b> Centro Acopio</b></th>
              <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;">
                {{element.sID_CentroAcopio}} </td>
            </ng-container>
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef  style="padding-left: 0px; "><b> Nombre</b></th>
              <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;"> {{element.nombre}}
              </td>
            </ng-container>
            

            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef ><b> Acci&oacute;n </b></th>
              <td mat-cell *matCellDef="let element" class="action-link" style="padding-left: 0px; text-align: center;">
                <a [ngClass]="{'linkdisable':!getModulePermission(105,'editar')}" title="Editar" (click)="openDialog('Actualizar',element)" class="m-r-10 cursor-pointer">
                  <img src="../../../../../../assets/images/Iconos/edit_blue.png"
                    style="width: 30px; height: auto;" /></a>
                <a [ngClass]="{'linkdisable':!getModulePermission(105,'eliminar')}"title="Eliminar" (click)="openDialog('Eliminar',element)" class="m-r-10 cursor-pointer">
                  <img src="../../../../../../assets/images/Iconos/delete_blue.png"
                    style="width: 30px; height: auto;" />
                </a>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let myRowData; columns: displayedColumns;"></tr>

          </table>
          <mat-paginator style="color: #005ACA;" #paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 50, 100]" showFirstLastButtons>
          </mat-paginator>
          <div *ngIf="isLoading"
            style="display: flex; justify-content: center; align-items: center; background: white;">
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
<div fxLayout="row wrap ">

  <div style="width: 100%; float: right; color: #005ACA;" class="align-items-center textagregar ">
    <div class="text-right ">
      <a [ngClass]="{'linkdisable':!getModulePermission(105,'crear')}" class="btn-agregar " (click)="openDialog('Adicionar',{})"><img
          src="../.././../assets/images//Iconos/add_blue.png " /> Crear Zonas ETC</a>
    </div>
  </div>

</div>
