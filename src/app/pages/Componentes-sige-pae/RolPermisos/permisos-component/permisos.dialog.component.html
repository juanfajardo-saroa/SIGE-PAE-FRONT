<div class="SizeDialog">
  <mat-card-header class="TituloDialog">
    <ng-container>
      <div mat-dialog-actions>
        <tr class="CenterButton">
          <td>
            <strong>{{ action }} rol permiso</strong>
          </td>
        </tr>
      </div>
    </ng-container>
  </mat-card-header>
</div>

<div class="course-app">
  <div class="example-form" [formGroup]="form" (ngSubmit)="doAction()">
    <mat-card-content>
      <div fxLayout="row wrap" class="course-app">
        <div fxFlex.gt-md="100" fxFlex.gt-lg="100" fxFlex="100">
          <div>
            <mat-card-content class="text-center">
              <mat-dialog-content class="mat-typography" *ngIf="action != 'Eliminar'; else elseTemplate">
                <br />
                <div *ngIf="action !='Adicionar'">
                  <div class="example-full-width">
                    <br />
                    <input matInput id="id" formControlName="id" readonly="true" class=" form-control"
                      style="display: none;" />
                  </div>
                </div>
                <table>

                  <ng-container>
                    <tr>
                      <td>
                        <div class="TextosBlueLeft"> Rol</div>
                      </td>
                      <td>
                        <mat-form-field class="example-full-width">
                          <mat-select id="id_Rol" formControlName="id_Rol">
                            <mat-option *ngFor="let item of AspNetRolesList" [value]="item.id">{{item.name}}
                            </mat-option>
                          </mat-select>
                        </mat-form-field>
                      </td>
                    </tr>
                  </ng-container>

                  <ng-container>
                    <tr>
                      <td>
                        <div class="TextosBlueLeft"> Modulo</div>
                      </td>
                      <td>
                        <mat-form-field class="example-full-width">
                          <mat-select id="id_Modulo" formControlName="id_Modulo">
                            <mat-option *ngFor="let item of ModuloList" [value]="item.id">{{item.nombre}}
                            </mat-option>
                          </mat-select>
                        </mat-form-field>
                      </td>
                    </tr>
                  </ng-container>
                </table>

                <table mat-table [dataSource]="dataSourceForm" class="left-radius right-radius">
                  <ng-container matColumnDef="ver">
                    <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 18%; ">Ver</th>
                    <td mat-cell *matCellDef="let row" style="padding-left: 0px; width: 18%; text-align: center;">
                      <mat-checkbox class="example-margin" id="ver" formControlName="ver"></mat-checkbox>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="crear">
                    <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 18%; ">Crear</th>
                    <td mat-cell *matCellDef="let row" style="padding-left: 0px; width: 18%; text-align: center;">
                      <mat-checkbox class="example-margin" id="crear" formControlName="crear"></mat-checkbox>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="editar">
                    <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 18%; ">Editar</th>
                    <td mat-cell *matCellDef="let row" style="padding-left: 0px; width: 18%; text-align: center;">
                      <mat-checkbox class="example-margin" id="editar" formControlName="editar"></mat-checkbox>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="eliminar">
                    <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 18%; ">Eliminar</th>
                    <td mat-cell *matCellDef="let row" style="padding-left: 0px; width: 18%; text-align: center;">
                      <mat-checkbox class="example-margin" id="eliminar" formControlName="eliminar">
                      </mat-checkbox>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="aprobar">
                    <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 18%; ">Aprobar</th>
                    <td mat-cell *matCellDef="let row" style="padding-left: 0px; width: 18%; text-align: center;">
                      <mat-checkbox class="example-margin" id="aprobar" formControlName="aprobar"></mat-checkbox>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="imprimir">
                    <th mat-header-cell *matHeaderCellDef style="width: 18%; text-align: center ">Imprimir</th>
                    <td mat-cell *matCellDef="let row" style="width: 18%; text-align: center;">
                      <mat-checkbox class="example-margin" id="imprimir" formControlName="imprimir">
                      </mat-checkbox>
                    </td>
                  </ng-container>
                  <tr mat-header-row *matHeaderRowDef="displayedColumnsForm"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumnsForm;"></tr>
                </table>

              </mat-dialog-content>
              <ng-template #elseTemplate>
                <div style="text-align: center;">
                  ¿Está seguro de eliminar el registro?
                </div>
              </ng-template>
              <table class="BordeSuperior">
                <ng-container>
                  <div>
                    <div class="CenterButton text-center">
                      <div class="AlignRight">
                        <button [disabled]="!form.valid && action !='Eliminar'" (click)="doAction()">{{action}}
                        </button>
                      </div>
                      <div>
                        <button (click)="closeDialog()">Cancelar
                        </button>
                      </div>
                    </div>
                  </div>
                </ng-container>
              </table>
            </mat-card-content>
          </div>
        </div>
      </div>
    </mat-card-content>
  </div>
</div>
