  <div class="row">
    <div class="col-12">
      <table class="tableFormUsuarios">
      <thead  style="float: left;" colspan="3" >
            <th class="bor-rad2val" style="display: inline-block; background-color: #ed0057;  color: #ffffff; border-radius: 30px 30px 0px 0px; padding: 25px 15px 11px 11px;  " colspan="3">Zonas </th>

          </thead>
       
        <tbody>
        <hr style="margin-top:0rem; border:none; border-top:1px dotted blue" colspan="12">

          <div fxLayout="row wrap">
            <div fxFlex="100">
              <mat-card>
                <mat-card-content >
                  <div class="row">
                    <div class="col-md-10" fxFlex.gt-lg="25" fxFlex="100">

                        <input
                        class="input"
                          matInput
                          (keyup)="applyFilter($any($event).target.value)"
                          placeholder="Buscar... Zonas"
                        />

                    </div>
                    <div class="col-md-2">
                      <a class="btn-registrar" (click)="openDialog('Adicionar', {})"
                        ><img
                          src="../.././../assets/images//Iconos/add_blue.png"
                        />
                        Agregar Zonas  </a
                      >
                    </div>
                  </div>
                </mat-card-content>
              </mat-card>
            </div>
          </div>
    <div fxLayout="row wrap">
      <div fxFlex="100">
        <mat-card>
          <mat-card-content>
            <div class="table-responsive">
              <div style="width: 100%; float: right;">
                <div class="titletable">Zonas</div>
              </div>
              <table mat-table [dataSource]="dataSource" class="left-radius" matSort >
                <ng-container matColumnDef="select">
                  <th mat-header-cell *matHeaderCellDef>
                    <mat-checkbox
                        (ngModel)="checked"
                        (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        indeterminate="selection.hasValue() && !isAllSelected()">
                    </mat-checkbox>
                  </th>
                  <td mat-cell *matCellDef="let row">
                    <mat-checkbox 
                        (ngModel)="checked"
                        (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)">
                    </mat-checkbox>
                  </td>
                </ng-container>
                <ng-container matColumnDef="id"> 
  <th mat-header-cell *matHeaderCellDef mat-sort-header style="padding-left: 0px; "> </th>
  <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;"> {{element.id}} </td>   
</ng-container>    
<ng-container matColumnDef="nombre"> 
  <th mat-header-cell *matHeaderCellDef mat-sort-header style="padding-left: 0px; "> Nombre</th>
  <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;"> {{element.nombre}} </td>   
</ng-container>    
<ng-container matColumnDef="auditoria"> 
  <th mat-header-cell *matHeaderCellDef mat-sort-header style="padding-left: 0px; "> auditoria</th>
  <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;"> {{element.auditoria}} </td>   
</ng-container>    
 
                <ng-container matColumnDef="action">
                  <th mat-header-cell *matHeaderCellDef  mat-sort-header> Acci&oacute;n </th>
                  <td mat-cell *matCellDef="let element" class="action-link">
                    <a (click)="openDialog('Actualizar',element)" class="m-r-10 cursor-pointer"><i class="fa fa-pencil"></i></a>
                    <a (click)="openDialog('Eliminar',element)" class="m-r-10 cursor-pointer">
                      <i class="fa fa-trash text"></i>
                    </a>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let myRowData; columns: displayedColumns;"></tr>

              </table>
              <mat-paginator #paginator
                [pageSize]="10"
                [pageSizeOptions]="[5, 10, 50, 100]"
                showFirstLastButtons>
              </mat-paginator>
              <div *ngIf="isLoading" style="display: flex; justify-content: center; align-items: center; background: white;">
              </div>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </tbody>
      </table>
    </div>
  </div>
