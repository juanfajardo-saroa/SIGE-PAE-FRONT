<!-- ============================================================== -->
<!-- Simple four boxes Row -->
<!-- ============================================================== -->
<div fxLayout="row" fxLayoutWrap="wrap">
    <!-- column -->
    <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
        <mat-card style="margin: 0px 15px; background: ghostwhite;">
            <mat-card-content>
                <!-- Row -->
                <div fxLayout="row" fxLayoutWrap="wrap">
                    <!-- column -->
                    <div fxFlex.gt-sm="50" fxFlex.gt-xs="50">
                      <div class="login-register-box error-card text-center">

                        <h1><mat-icon>build</mat-icon></h1>
                        <h3 class="text-uppercase">En este momento no esta disponible este componente, se encuentra en construcción</h3>
                        <p class="text-muted m-t-30 m-b-30">Es posible que no tenga permiso para ver este directorio o página con las credenciales que proporcionó </p>
                        <a mat-raised-button color="#005ACA" [routerLink]="['/']" class="btn btn-round btn-high waves-effect waves-light m-b-40">Retornar al Inicio</a>
                    </div>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
    <!-- column -->
</div>
