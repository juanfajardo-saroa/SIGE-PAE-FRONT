<div class="SizeDialog">
  <mat-card-header class="TituloDialog">
    <ng-container>
      <div mat-dialog-actions>
        <tr class="CenterButton">
          <td>
               <span class="course-name">     Acción <strong>{{ action }}</strong></span>
          </td>
        </tr>
      </div>
    </ng-container>
  </mat-card-header>
  <div class="container">
    <mat-card-content class="text-center">
      <mat-dialog-content *ngIf="action != 'Eliminar'; else elseTemplate">
        <div class="dialog-form" [formGroup]="form" (ngSubmit)="doAction()">
          <table class="tableFormUsuarios">

                <div *ngIf = "action !='Adicionar'">
 <tr class="d-flex">
     <td class="col-6" style ="text-align:start">Id</td>
     <td class="col-6">     <input  matInput  id="id" formControlName="id"  readonly="true" class=" cssForm"/>      </td>
 </tr>
</div>
<hr style="margin-top: 0rem; border: none;border-top: 1px dotted blue;" colspan ="12" />
<tr class="d-flex">
     <td class="col-6" style ="text-align:start">"Minuta Aprobacion"</td>
     <td class="col-6" >
        <input matInput id="iD_MinutaAprobacion" formControlName="iD_MinutaAprobacion"  required placeholder="Minuta Aprobacion" class="cssForm"/>
        <div *ngIf = "form.get('iD_MinutaAprobacion')?.invalid && (form.get('iD_MinutaAprobacion')?.dirty || form.get('iD_MinutaAprobacion')?.touched)" class="invalid-feedback">
        </div>
     </td>
</tr>
<hr style="margin-top: 0rem; border: none;border-top: 1px dotted blue;" colspan ="12" />
<tr class="d-flex">
     <td class="col-6" style ="text-align:start">"Fecha Aprobacion"</td>
     <td class="col-6" >
        <input matInput [matDatepicker] = "fechaAprobacion"  formControlName="fechaAprobacion" id="fechaAprobacion">
        <mat-datepicker-toggle matSuffix [for]="fechaAprobacion">
            <mat-icon matDatepickerToggleIcon>calendar_month</mat-icon>
            </mat-datepicker-toggle>
        <mat-datepicker #fechaAprobacion></mat-datepicker>
    </td>
</tr>
<hr style="margin-top: 0rem; border: none;border-top: 1px dotted blue;" colspan ="12" />
<tr class="d-flex">
     <td class="col-6" style ="text-align:start">"Tipo Estado Minuta"</td>
     <td class="col-6" >
        <input matInput id="iD_TipoEstadoMinuta" formControlName="iD_TipoEstadoMinuta"  required placeholder="Tipo Estado Minuta" class="cssForm"/>
        <div *ngIf = "form.get('iD_TipoEstadoMinuta')?.invalid && (form.get('iD_TipoEstadoMinuta')?.dirty || form.get('iD_TipoEstadoMinuta')?.touched)" class="invalid-feedback">
        </div>
     </td>
</tr>
<hr style="margin-top: 0rem; border: none;border-top: 1px dotted blue;" colspan ="12" />
<tr class="d-flex">
     <td class="col-6" style ="text-align:start">"Responsable"</td>
     <td class="col-6" >
        <input matInput id="responsable" formControlName="responsable"  required placeholder="Responsable" class="cssForm"/>
        <div *ngIf = "form.get('responsable')?.invalid && (form.get('responsable')?.dirty || form.get('responsable')?.touched)" class="invalid-feedback">
        </div>
     </td>
</tr>
<hr style="margin-top: 0rem; border: none;border-top: 1px dotted blue;" colspan ="12" />
<tr class="d-flex">
     <td class="col-6" style ="text-align:start">"Rol Responsable"</td>
     <td class="col-6" >
        <input matInput id="rolResponsable" formControlName="rolResponsable"  required placeholder="Rol Responsable" class="cssForm"/>
        <div *ngIf = "form.get('rolResponsable')?.invalid && (form.get('rolResponsable')?.dirty || form.get('rolResponsable')?.touched)" class="invalid-feedback">
        </div>
     </td>
</tr>
<hr style="margin-top: 0rem; border: none;border-top: 1px dotted blue;" colspan ="12" />
<tr class="d-flex">
     <td class="col-6" style ="text-align:start">"Accion"</td>
     <td class="col-6" >
        <input matInput id="accion" formControlName="accion"  required placeholder="Accion" class="cssForm"/>
        <div *ngIf = "form.get('accion')?.invalid && (form.get('accion')?.dirty || form.get('accion')?.touched)" class="invalid-feedback">
        </div>
     </td>
</tr>
<hr style="margin-top: 0rem; border: none;border-top: 1px dotted blue;" colspan ="12" />
<tr class="d-flex">
     <td class="col-6" style ="text-align:start">"Observaciones"</td>
     <td class="col-6" >
        <input matInput id="observaciones" formControlName="observaciones"  required placeholder="Observaciones" class="cssForm"/>
        <div *ngIf = "form.get('observaciones')?.invalid && (form.get('observaciones')?.dirty || form.get('observaciones')?.touched)" class="invalid-feedback">
        </div>
     </td>
</tr>
<hr style="margin-top: 0rem; border: none;border-top: 1px dotted blue;" colspan ="12" />
<hr style="margin-top: 0rem; border: none;border-top: 1px dotted blue;" colspan ="12" />
  
           
          </table>
        </div>
      </mat-dialog-content>
      <ng-template #elseTemplate>
        Esta Seguro de Eliminar el Registro <b>{{ local_data.id }}</b
        >?
      </ng-template>
    </mat-card-content>
    <mat-card-actions class="text-center">
      <div mat-dialog-actions align="center">
        <button
          class="btn btn-round btn-middle"
          [disabled]="form.invalid && action != 'Eliminar'"
          mat-raised-button
          color="primary"
          mat-button
          (click)="doAction()"
        >
          {{ action }}
        </button>
        <button
          class="btn btn-round btn-high"
          mat-raised-button
          color="warn"
          mat-button
          (click)="closeDialog()"
          mat-flat-button
        >
          Cancelar
        </button>
      </div>
    </mat-card-actions>
  </div>
</div>
