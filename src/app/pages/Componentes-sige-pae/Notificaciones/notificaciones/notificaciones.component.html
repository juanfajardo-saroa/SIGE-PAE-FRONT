<table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="mensaje">
    <th mat-header-cell *matHeaderCellDef class="LeftUpCorner"> <b class="tableTittle">Notificaciones</b> </th>
    <td mat-cell *matCellDef="let item" style="padding-left: 20px;">
      <span ng-if="disableSubmit(item.estadoMensaje)" [ngStyle]="{'color':getColor(item.modulo)}">{{item.modulo}}</span>
      <br>
      {{item.mensaje}}
      <div class="pull-right">
        <button mat-button class="buttonVer" [hidden]="disableUrl(item.urlMensaje)"
          [disabled]="disableUrl(item.urlMensaje)" (click)="notificationClick(item.id, item.urlMensaje, item.estadoMensaje,item.mensaje)">Ver</button>
      </div>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columnNames"></tr>
  <tr mat-row *matRowDef="let row; columns: columnNames;" [ngStyle]="{'background-color': disableRead(row.estadoMensaje)}"></tr>
</table>
<mat-paginator style="color:#005ACA ;" #paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 50, 100]"
showFirstLastButtons>
</mat-paginator>
