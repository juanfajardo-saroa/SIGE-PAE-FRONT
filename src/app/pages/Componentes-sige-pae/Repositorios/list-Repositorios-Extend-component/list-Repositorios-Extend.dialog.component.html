<div class="SizeDialog">

  <mat-card-header class="TituloDialog">
    <ng-container>
      <div mat-dialog-actions>
        <tr class="CenterButton">
          <td>
            Nuevo Recurso
          </td>
        </tr>
      </div>
    </ng-container>
  </mat-card-header>

  <mat-card-content>
    <div>
      <div class="SizeDialog">
        <div>
          <mat-card-content class="text-center">
            <mat-dialog-content class="mat-typography" *ngIf="action != 'Eliminar'; else elseTemplate">
              <br />

              <div class="example-form" [formGroup]="form" (ngSubmit)="doAction()">

                <div *ngIf="action !='Adicionar'">
                  <div>
                    <br />
                    <input matInput id="id" formControlName="id" readonly="true" class=" form-control" />
                  </div>
                </div>

                <table>
                  <ng-container>
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">1. Tipo Archivo<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <!-- <mat-form-field>
                          <mat-label> Seleccione Tipo Archivo *</mat-label>
                          <mat-select id="idTipoArchivo" formControlName="idTipoArchivo">
                            <mat-option *ngFor="let item of TipoArchivoList" 
                              [value]="item.id">{{item.nombre}}
                            </mat-option>
                          </mat-select>
                        </mat-form-field> -->
                        <mat-select id="idTipoArchivo" formControlName="idTipoArchivo" class="tablaform"placeholder="Tipo Archivo">
                          <mat-option *ngFor="let item of TipoArchivoList" 
                            [value]="item.id">{{item.nombre}}
                          </mat-option>
                        </mat-select>
                      </td>
                    </tr>
                  </ng-container>

                  <ng-container>
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">2. Categor&iacute;a<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <!-- mat-form-field>
                          <mat-label> Seleccione Categor&iacute;a *</mat-label>
                          <mat-select id="idCategoria" formControlName="idCategoria" class="tablaform">
                            <mat-option *ngFor="let item of CategoriasList" [value]="item.id">{{item.nombre}}
                            </mat-option>
                          </mat-select>
                        </mat-form-field> -->
                        <mat-select id="idCategoria" formControlName="idCategoria" class="tablaform"placeholder="Categor&iacute;a">
                          <mat-option *ngFor="let item of CategoriasList" [value]="item.id">{{item.nombre}}
                          </mat-option>
                        </mat-select>
                      </td>
                    </tr>
                  </ng-container>

                  <ng-container>
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">3. Vigencia<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <!-- <mat-form-field>
                          <mat-label> Seleccione Vigencia *</mat-label>
                          <mat-select id="idVigencia" formControlName="idVigencia" class="tablaform">
                            <mat-option *ngFor="let item of VigenciasList" [value]="item.id">{{item.nombre}}
                            </mat-option>
                          </mat-select>
                        </mat-form-field> -->
                        <mat-select id="idVigencia" formControlName="idVigencia" class="tablaform"placeholder="Vigencia">
                          <mat-option *ngFor="let item of VigenciasList" [value]="item.id">{{item.nombre}}
                          </mat-option>
                        </mat-select>
                      </td>
                    </tr>
                  </ng-container>

                  <ng-container >
                    <tr class="Oculto">
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">4. Nombre Archivo<span style="color:red;">* </span> </div>
                      </td>
                      <td class="BordeSeparador">
                        <!-- <mat-form-field>
                          <mat-label>Nombre Archivo Storage</mat-label>
                          <br />
                          <input matInput id="Nombre Archivo Storage" formControlName="pahtArchivo" 
                            placeholder="Nombre Archivo Storage" class="form-control" readonly />
                          <div
                            class="invalid-feedback">
                          </div>
                        </mat-form-field> -->
                        <input matInput id="Nombre Archivo Storage" formControlName="pahtArchivo" 
                        placeholder="Nombre Archivo" class="form-control" readonly />
                      <div
                        class="invalid-feedback">
                      </div>
                      </td>
                    </tr>
                  </ng-container>

                  <ng-container>
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">4. Nombre<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <!-- <mat-form-field>
                          <mat-label>Nombre</mat-label>
                          <br />
                          <input matInput id="nombre" formControlName="nombre" required placeholder="Título de archivo"
                            class="form-control" />
                          <div
                            *ngIf="form.get('nombre').invalid && (form.get('nombre').dirty || form.get('nombre').touched)"
                            class="invalid-feedback">
                          </div>
                        </mat-form-field> -->
                        <input id="nombre" formControlName="nombre" required placeholder="Título de archivo"
                            class="form-control" />
                          <div
                            *ngIf="form.get('nombre').invalid && (form.get('nombre').dirty || form.get('nombre').touched)"
                            class="invalid-feedback">
                          </div>
                      </td>
                    </tr>
                  </ng-container>

                  <ng-container>
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">5. Descripción<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <!-- <mat-form-field>
                          <mat-label>Descripción</mat-label>
                          <br />
                          <input matInput id="descripcion" formControlName="descripcion" required
                            placeholder="Descripción" class="form-control" />
                          <div
                            *ngIf="form.get('descripcion').invalid && (form.get('descripcion').dirty || form.get('descripcion').touched)"
                            class="invalid-feedback">
                          </div>
                        </mat-form-field> -->
                        <input id="descripcion" formControlName="descripcion" required
                            placeholder="Descripción" class="form-control" />
                          <div
                            *ngIf="form.get('descripcion').invalid && (form.get('descripcion').dirty || form.get('descripcion').touched)"
                            class="invalid-feedback">
                          </div>
                      </td>
                    </tr>
                  </ng-container>

                  <ng-container>
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">6. Fecha Archivo<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <!-- <mat-form-field>
                          <mat-label>Fecha Archivo *</mat-label>
                          <br />
                          <input matInput [matDatepicker]="fechaArchivo" formControlName="fechaArchivo"
                            id="fechaArchivo">
                          <mat-datepicker-toggle matSuffix [for]="fechaArchivo">
                            <mat-icon style="color: rgb(14, 92, 235);" matDatepickerToggleIcon>calendar_month</mat-icon>
                          </mat-datepicker-toggle>
                          <mat-datepicker #fechaArchivo></mat-datepicker>
                        </mat-form-field> -->
                        <input class="fechaText" matInput [matDatepicker]="fechaArchivo" formControlName="fechaArchivo"
                            id="fechaArchivo">
                          <mat-datepicker-toggle matSuffix [for]="fechaArchivo">
                            <mat-icon style="color: rgb(14, 92, 235);" matDatepickerToggleIcon>calendar_month</mat-icon>
                          </mat-datepicker-toggle>
                          <mat-datepicker #fechaArchivo></mat-datepicker>
                      </td>
                    </tr>
                  </ng-container>

                  <ng-container>
                    <tr>
                      <td class="">
                        <div class="TextosBlueLeft">7. Archivo Adjunto<span style="color:red;">* </span></div>
                      </td>
                      <td>
                        <div class="container">
                          <div class="button-wrap">

                            <div>
                              <button class="text-center buttonAr3 btn-file CenterAll">Adjuntar archivo
                                <img style="transform: rotate(180deg)" src="../.././../../assets/iconos_PAE/PNG/Iconos_PAE-4.png " height="20px"
                                  width="auto">
                                <input name="photo" type="file" data-max-size="3064" 
                                  (change)="onFileSelected($any($event).currentTarget.files)" 
                                  accept="'image/png', 'image/jpg', 'image/jpeg', 'image/gif', 'image/tiff', 'image/gif',
                    'application/vnd.rar', 'application/zip', 'application/msword',
                    'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                    'application/pdf', 'application/vnd.ms-excel',
                    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/vnd.ms-powerpoint',
                    'application/vnd.openxmlformats-officedocument.presentationml.presentation', 'text/plain'" />
                              </button>
                            </div>
                          </div>
                        </div>

                      </td>
                    </tr>
                  </ng-container>
                </table>
              </div>
            </mat-dialog-content>

            <ng-template #elseTemplate>
              Esta Seguro de Eliminar el Registro <b>{{local_data.id}}</b>?
            </ng-template>
            <!-- ---------------------------------Botones----------------------------- -->
            <table class="BordeSuperior">
              <ng-container>
                <div>
                  <div class="CenterButton text-center">
                    <div class="AlignRight">
                      <button [disabled]="form.invalid && action !='Eliminar'" (click)="doAction()">{{action}}
                      </button>
                    </div>
                    <div>
                      <button (click)="closeDialog()">Cancelar
                      </button>
                    </div>
                  </div>
                </div>
              </ng-container>
            </table>

          </mat-card-content>
        </div>
      </div>
    </div>
  </mat-card-content>
</div>
