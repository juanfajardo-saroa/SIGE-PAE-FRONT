<div class="SizeDialog">
  <mat-card-header class="TituloDialog">
    <ng-container>
      <div mat-dialog-actions>
        <tr class="CenterButton">
          <td>
            <span class="course-name">
              Acción <strong>{{ action }}</strong></span
            >
          </td>
        </tr>
      </div>
    </ng-container>
  </mat-card-header>
  <div class="container">
    <mat-card-content class="text-center">
      <mat-dialog-content *ngIf="action != 'Eliminar'; else elseTemplate">
        <div class="dialog-form" [formGroup]="form" (ngSubmit)="doAction()">
          <table class="tableFormUsuarios">
            <tr class="d-flex">
              <td class="col-1" style="text-align: start">Application</td>
              <td class="col-5">
                <input
                  matInput
                  id="application"
                  formControlName="application"
                  required
                  placeholder="Application"
                  class="cssForm"
                />
                <div
                  div
                  *ngIf="
                    form.get('application')?.invalid &&
                    (form.get('application')?.dirty ||
                      form.get('application')?.touched)
                  "
                  class="invalid-feedback"
                ></div>
              </td>
              <td class="col-1" style="text-align: start">Host</td>
              <td class="col-5">
                <input
                  matInput
                  id="host"
                  formControlName="host"
                  required
                  placeholder="Host"
                  class="cssForm"
                />
                <div
                  *ngIf="
                    form.get('host')?.invalid &&
                    (form.get('host')?.dirty || form.get('host')?.touched)
                  "
                  class="invalid-feedback"
                ></div>
              </td>
            </tr>
            <hr
              style="
                margin-top: 0rem;
                border: none;
                border-top: 1px dotted blue;
              "
              colspan="12"
            />

            <tr class="d-flex">
              <td class="col-1" style="text-align: start">Type</td>
              <td class="col-2">
                <input
                  matInput
                  id="type"
                  formControlName="type"
                  required
                  placeholder="Type"
                  class="cssForm"
                />
                <div
                  *ngIf="
                    form.get('type')?.invalid &&
                    (form.get('type')?.dirty || form.get('type')?.touched)
                  "
                  class="invalid-feedback"
                ></div>
              </td>
              <td class="col-1" style="text-align: start">Source</td>
              <td class="col-2">
                <input
                  matInput
                  id="source"
                  formControlName="source"
                  required
                  placeholder="Source"
                  class="cssForm"
                />
                <div
                  *ngIf="
                    form.get('source')?.invalid &&
                    (form.get('source')?.dirty || form.get('source')?.touched)
                  "
                  class="invalid-feedback"
                ></div>
              </td>
              <td class="col-1" style="text-align: start">Time Utc</td>
              <td class="col-3"><span style="border: 1px #36c solid;padding: 2px 0px;width: 100%;color: #36c;border-radius: 5px;background-color: ghostwhite !important;box-sizing: content-box;">{{local_data.timeUtc}} </span>
              </td>
              <td class="col-1" style="text-align: start">Sequence</td>
              <td class="col-1">
                <input
                  matInput
                  id="sequence"
                  formControlName="sequence"
                  required
                  placeholder="Sequence"
                  class="cssForm"
                />
                <div
                  *ngIf="
                    form.get('sequence')?.invalid &&
                    (form.get('sequence')?.dirty ||
                      form.get('sequence')?.touched)
                  "
                  class="invalid-feedback"
                ></div>
              </td>
            </tr>
            <hr
              style="
                margin-top: 0rem;
                border: none;
                border-top: 1px dotted blue;
              "
              colspan="12"
            />

            <tr class="d-flex">
              <td class="col-1" style="text-align: start">Message</td>
              <td class="col-11"  >
                <textarea style="resize: auto;border: 1px #36c solid;padding: 2px 0px;width: 100%;color: #36c;border-radius: 5px;background-color: ghostwhite !important;box-sizing: content-box; height: 20px;height: 1520px;transition: height ease-in-out 400ms; height: unset; white-space: normal; overflow: visible; line-height: initial;     word-wrap: break-word;max-width: initial;">{{local_data.message}} </textarea>


              </td>
            </tr>
            <hr
              style="
                margin-top: 0rem;
                border: none;
                border-top: 1px dotted blue;
              "
              colspan="12"
            />
            <tr class="d-flex">
              <td class="col-1" style="text-align: start">User</td>
              <td class="col-5">
                <input
                  matInput
                  id="user"
                  formControlName="user"
                  required
                  placeholder="User"
                  class="cssForm"
                />
                <div
                  *ngIf="
                    form.get('user')?.invalid &&
                    (form.get('user')?.dirty || form.get('user')?.touched)
                  "
                  class="invalid-feedback"
                ></div>
              </td>
              <td class="col-1" style="text-align: start">Status Code</td>
              <td class="col-5">
                <input
                  matInput
                  id="statusCode"
                  formControlName="statusCode"
                  required
                  placeholder="Status Code"
                  class="cssForm"
                />
                <div
                  *ngIf="
                    form.get('statusCode')?.invalid &&
                    (form.get('statusCode')?.dirty ||
                      form.get('statusCode')?.touched)
                  "
                  class="invalid-feedback"
                ></div>
              </td>
            </tr>
            <hr
              style="
                margin-top: 0rem;
                border: none;
                border-top: 1px dotted blue;
              "
              colspan="12"
            />



            <tr class="d-flex">
              <td class="col-1" style="text-align: start">All Xml</td>
              <td class="col-11"  >
                <textarea style="resize: auto;border: 1px #36c solid;padding: 2px 0px;width: 100%;color: #36c;border-radius: 5px;background-color: ghostwhite !important;box-sizing: content-box;  white-space: normal; overflow: visible; line-height: initial;     word-wrap: break-word;max-width: initial;height: 305px;">{{local_data.allXml}} </textarea>


              </td>
            </tr>
            <hr
              style="
                margin-top: 0rem;
                border: none;
                border-top: 1px dotted blue;
              "
              colspan="12"
            />
            <tr class="d-flex">
              <td class="col-1" style="text-align: start">Data</td>
              <td class="col-11"  >
                <textarea style="resize: auto;border: 1px #36c solid;padding: 2px 0px;width: 100%;color: #36c;border-radius: 5px;background-color: ghostwhite !important;box-sizing: content-box;  white-space: normal; overflow: visible; line-height: initial;     word-wrap: break-word;max-width: initial;height: 305px;">{{xmltojson(local_data.allXml)}} </textarea>


              </td>
              <!-- <ngx-json-viewer [json]="datosjson"></ngx-json-viewer> -->
            </tr>
            <hr
              style="
                margin-top: 0rem;
                border: none;
                border-top: 1px dotted blue;
              "
              colspan="12"
            />
            <hr
              style="
                margin-top: 0rem;
                border: none;
                border-top: 1px dotted blue;
              "
              colspan="12"
            />
          </table>
        </div>
      </mat-dialog-content>
      <ng-template #elseTemplate>
        Esta Seguro de Eliminar el Registro <b>{{ local_data.id }}</b
        >?
      </ng-template>
    </mat-card-content>
    <mat-card-actions class="text-center">
      <div mat-dialog-actions align="center">
        <button
          class="btn btn-round btn-middle"
          [disabled]="form.invalid && action != 'Eliminar'"
          mat-raised-button
          color="primary"
          mat-button
          (click)="doAction()"
        >
          {{ action }}
        </button>
        <button
          class="btn btn-round btn-high"
          mat-raised-button
          color="warn"
          mat-button
          (click)="closeDialog()"
          mat-flat-button
        >
          Cancelar
        </button>
      </div>
    </mat-card-actions>
  </div>
</div>
