<div class="SizeDialog">

  <mat-card-header class="TituloDialog">
    <ng-container>
      <div mat-dialog-actions>
        <tr class="CenterButton">
          <td>
            {{ action }} Recurso
          </td>
        </tr>
      </div>
    </ng-container>
  </mat-card-header>
  <div class="course-app">
    <mat-card-content>
      <div fxLayout="row wrap" class="course-app">
        <div fxFlex.gt-md="100" fxFlex.gt-lg="100" fxFlex="100">
          <div>
            <mat-card-content class="text-center">
              <mat-dialog-content class="mat-typography" *ngIf="action != 'Eliminar'; else elseTemplate">
                <br />

                <div class="example-form" [formGroup]="form" (ngSubmit)="doAction()">
                  <div *ngIf="action !='Adicionar'" class="Invisible">
                    <div>
                      <br />
                      <input matInput id="id" formControlName="id" readonly="true" class=" form-control" />
                    </div>
                  </div>
                  <table>
                    <ng-container>
                      <tr>
                        <td>
                          <div class="TextosBlueLeft"> Esquema*</div>
                        </td>
                        <td>
                          <div>
                            <mat-label>Esquema</mat-label>
                            <br />
                            <input matInput id="esquema" formControlName="esquema" required placeholder="Esquema"
                              class="form-control" />
                            <div
                              *ngIf="form.get('esquema')?.invalid && (form.get('esquema')?.dirty || form.get('esquema')?.touched)"
                              class="invalid-feedback">
                            </div>
                          </div>
                        </td>
                      </tr>
                    </ng-container>

                    <ng-container>
                      <tr>
                        <td>
                          <div class="TextosBlueLeft">Nombre De Tabla*</div>
                        </td>
                        <td>
                          <div>
                            <mat-label>Nombre De Tabla</mat-label>
                            <br />
                            <input matInput id="table_Name" formControlName="table_Name" required
                              placeholder="Nombre De Tabla" class="form-control" />
                            <div
                              *ngIf="form.get('table_Name')?.invalid && (form.get('table_Name')?.dirty || form.get('table_Name')?.touched)"
                              class="invalid-feedback">
                            </div>
                          </div>
                        </td>
                      </tr>
                    </ng-container>

                    <ng-container>
                      <tr>
                        <td>
                          <div class="TextosBlueLeft"> Nombre*</div>
                        </td>
                        <td>
                          <div>
                            <mat-label>Nombre</mat-label>
                            <br />
                            <input matInput id="nombre" formControlName="nombre" required placeholder="Nombre"
                              class="form-control" />
                            <div
                              *ngIf="form.get('nombre')?.invalid && (form.get('nombre')?.dirty || form.get('nombre')?.touched)"
                              class="invalid-feedback">
                            </div>
                          </div>
                        </td>
                      </tr>
                    </ng-container>

                    <ng-container>
                      <tr>
                        <td>
                          <mat-card>
                            <mat-card-content>
                              <section class="example-section">
                                <mat-checkbox class="example-margin" id="auditCampo" formControlName="auditCampo">
                                  Campo Auditoría
                                </mat-checkbox>
                              </section>
                            </mat-card-content>
                          </mat-card>
                        </td>
                        <td>
                          <mat-card>
                            <mat-card-content>
                              <section class="example-section">
                                <mat-checkbox class="example-margin" id="auditTabla" formControlName="auditTabla">
                                  Tabla Auditoría
                                </mat-checkbox>
                              </section>
                            </mat-card-content>
                          </mat-card>
                        </td>
                      </tr>
                    </ng-container>

                  </table>
                </div>
              </mat-dialog-content>
              <ng-template #elseTemplate>
                Esta Seguro de Eliminar el Registro ?
              </ng-template>

              <table class="BordeSuperior">
                <ng-container>
                  <div>
                    <div class="CenterButton text-center">
                      <div class="AlignRight">
                        <button [disabled]="form.invalid && action !='Eliminar'" (click)="doAction()">
                          {{action}} </button>
                      </div>
                      <div>
                        <button (click)="closeDialog()">Cancelar</button>
                      </div>
                    </div>
                  </div>
                </ng-container>
              </table>
            </mat-card-content>

          </div>
        </div>
      </div>
    </mat-card-content>
  </div>
</div>
