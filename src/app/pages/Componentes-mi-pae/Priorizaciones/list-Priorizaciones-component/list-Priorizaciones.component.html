<div fxLayout="row wrap">
  <div fxFlex="100">
    <mat-card>
      <mat-card-content>
        <div class="table-responsive">
          <div style="width: 100%; float: right;">
            <div class="titletable">Priorizaciones</div>
          </div>
          <table mat-table [dataSource]="dataSource" class="left-radius" matSort>


            <ng-container matColumnDef="select">
              <th mat-header-cell *matHeaderCellDef>
                <mat-checkbox (change)="$event ? masterToggle() : null"
                  [checked]="selection.hasValue() && isAllSelected()"
                  [indeterminate]="selection.hasValue() && !isAllSelected()">
                </mat-checkbox>
              </th>
              <td mat-cell *matCellDef="let row">
                <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                  [checked]="selection.isSelected(row)">
                </mat-checkbox>
              </td>
            </ng-container>

            <ng-container matColumnDef="grado">
              <th class="LeftUpCorner" mat-header-cell *matHeaderCellDef mat-sort-header style="padding-left: 0px; ">
                <b> Grado</b></th>
              <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;">
                {{element.sID_Grado}} </td>
            </ng-container>
            <ng-container matColumnDef="jornada">
              <th mat-header-cell *matHeaderCellDef mat-sort-header style="padding-left: 0px; "><b>Jornada</b></th>
              <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;">
                {{element.sID_jornada}} </td>
            </ng-container>
            <ng-container matColumnDef="modalidad">
              <th mat-header-cell *matHeaderCellDef mat-sort-header style="padding-left: 0px; "><b> Modalidad </b>
              </th>
              <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;">
                {{element.sID_TiposModalidadComplemento}} </td>
            </ng-container>
            <ng-container matColumnDef="modelo">
              <th mat-header-cell *matHeaderCellDef mat-sort-header style="padding-left: 0px; "><b> Modelo </b>
              </th>
              <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;">
                {{element.sID_TiposModeloOperacion}} </td>
            </ng-container>
            <ng-container matColumnDef="tipoRacion">
              <th mat-header-cell *matHeaderCellDef mat-sort-header style="padding-left: 0px; "> <b> Tipo de ración </b>
              </th>
              <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;">
                {{element.sID_TiposRacion}} </td>
            </ng-container>
            <ng-container matColumnDef="numeroComplementos">
              <th mat-header-cell *matHeaderCellDef mat-sort-header style="padding-left: 0px; "> <b> Número de raciones
                </b>
              </th>
              <td mat-cell *matCellDef="let element" style="padding-left: 0px; text-align: center;">
                {{element.numeroComplementos}} </td>
            </ng-container>
            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> <b>Acción </b> </th>
              <td mat-cell *matCellDef="let element" class="action-link" style="padding-left: 0px; text-align: center;">
                <a title="Editar" (click)="openDialog('Actualizar',element)" class="m-r-10 cursor-pointer"
                  [ngClass]="{'linkdisable':!getModulePermission(1,'editar')}">
                  <img src="../../../../../../assets/images/Iconos/edit_blue.png"
                    style="width: 20px; height: 20px;" /></a>
                <a title="Eliminar" (click)="openDialog('Eliminar',element)" class="m-r-10 cursor-pointer"
                  [ngClass]="{'linkdisable':!getModulePermission(1,'eliminar')}">
                  <img src="../../../../../../assets/images/Iconos/delete_blue.png"
                    style="width: 20px; height: 20px;" />
                </a>
                <a title="Novedades" (click)="irNovedades(element)" class="m-r-10 cursor-pointer"
                  [ngClass]="{'linkdisable':!getModulePermission(1,'ver')}">
                  <img src="../../../../../assets/iconos_PAE/PNG/Iconos_PAE-28.png"
                    style="width: 20px; height: 20px;" />
                </a>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let myRowData; columns: displayedColumns;"></tr>

          </table>
          <mat-paginator style="color: #005ACA ;" #paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 50, 100]"
            showFirstLastButtons>
          </mat-paginator>
          <div *ngIf="isLoading"
            style="display: flex; justify-content: center; align-items: center; background: white;">
            <mat-progress-spinner color="primary" mode="indeterminate">
            </mat-progress-spinner>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<div fxLayout="row wrap " style=" float: right;">
  <button class="BordeRedondoAgregar" mat-raised-button (click)="openDialog('Agregar',{})"
    [ngClass]="{'linkdisable':!getModulePermission(1,'crear')}">
    <img src="../.././../assets/images//Iconos/add_blue.png" height="auto">
    Crear priorización
  </button>
</div>
