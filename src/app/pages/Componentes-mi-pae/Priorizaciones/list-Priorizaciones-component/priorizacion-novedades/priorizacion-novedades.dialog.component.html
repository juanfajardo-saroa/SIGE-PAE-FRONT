<script src="https://cdn.jsdelivr.net/npm/sweetalert2@9.3.4/dist/sweetalert2.all.min.js"></script>
<div class="SizeDialog">

  <mat-card-header class="TituloDialog">
    <ng-container>
      <div mat-dialog-actions>
        <tr class="CenterButton">
          <td>
            <strong>{{ action }} Novedades de Priorizaciones</strong>
          </td>
        </tr>
      </div>
    </ng-container>
  </mat-card-header>
</div>
<div class="course-app">
  <div class="example-form" [formGroup]="form" (ngSubmit)="doAction()">
    <mat-card-content>
      <div fxLayout="row wrap" class="course-app">
        <div fxFlex.gt-md="100" fxFlex.gt-lg="100" fxFlex="100">
          <div>
            <mat-card-content class="text-center">
              <mat-dialog-content class="mat-typography" *ngIf="action != 'Eliminar'; else elseTemplate">
                <br />
                <div *ngIf="action !='Adicionar'">
                  <div class="example-full-width">
                    <br />
                    <input id="id" formControlName="id" readonly="true" class=" form-control" style="display: none;" />
                  </div>
                </div>
                <table>

                  <ng-container *ngIf="action =='Actualizar'">
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">1. Fecha de las novedades<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <input id="fecha" formControlName="fecha" required readonly="true"
                          Xplaceholder="Fecha de las novedades" class="tablaform" />
                        <div *ngIf="form.get('fecha').invalid && (form.get('fecha').dirty || form.get('fecha').touched)"
                          class="invalid-feedback">
                        </div>
                      </td>
                    </tr>
                  
                  </ng-container>

                  <ng-container *ngIf="action =='Adicionar'">
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">1. Descripción de las novedades<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <input id="descripcion" formControlName="descripcion" required
                          placeholder="Descripción de las novedades" class="tablaform" />
                        <div
                          *ngIf="form.get('descripcion').invalid && (form.get('descripcion').dirty || form.get('descripcion').touched)"
                          class="invalid-feedback">
                        </div>
                      </td>
                    </tr>
                    
                  </ng-container>

                  <ng-container *ngIf="action =='Actualizar'">
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">2. Descripción de las novedades<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <input id="descripcion" formControlName="descripcion" required
                          placeholder="Descripción de las novedades" class="tablaform" />
                        <div
                          *ngIf="form.get('descripcion').invalid && (form.get('descripcion').dirty || form.get('descripcion').touched)"
                          class="invalid-feedback">
                        </div>
                      </td>
                    </tr>
                    
                  </ng-container>

                  <ng-container *ngIf="action =='Actualizar'">
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">3. Nombre del Archivo<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <input id="archivo" formControlName="archivo" required placeholder="Nombre Archivo"
                          class="tablaform" readonly="true" />
                        <div
                          *ngIf="form.get('archivo').invalid && (form.get('archivo').dirty || form.get('archivo').touched)"
                          class="invalid-feedback">
                        </div>
                      </td>
                    </tr>
                 
                  </ng-container>

                  <ng-container *ngIf="action =='Adicionar'">
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">2. Nombre del Archivo<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">
                        <input id="archivo" formControlName="archivo" required placeholder="Nombre Archivo"
                          class="tablaform" readonly="true" />
                        <div
                          *ngIf="form.get('archivo').invalid && (form.get('archivo').dirty || form.get('archivo').touched)"
                          class="invalid-feedback">
                        </div>
                      </td>
                    </tr>
                   
                  </ng-container>

                  <ng-container *ngIf="action =='Actualizar'">
                    <tr>
                      <td>
                        <div class="TextosBlueLeft">4. Archivo Adjunto</div>
                      </td>
                      <td>
                        <div class="container">
                          <div class="button-wrap">
                            <div>
                              <button class="text-center buttonAr3 btn-file CenterAll">Adjuntar archivo
                                <img style="transform: rotate(180deg)"
                                  src="../.././../../assets/iconos_PAE/PNG/Iconos_PAE-4.png " height="20px"
                                  width="auto">
                                <input name="photo" type="file" data-max-size="3064" required
                                  (change)="onFileSelected($any($event).currentTarget.files)" accept="'image/png', 'image/jpg', 'image/jpeg', 'image/gif', 'image/tiff', 'image/gif',
                    'application/vnd.rar', 'application/zip', 'application/msword',
                    'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                    'application/pdf', 'application/vnd.ms-excel',
                    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/vnd.ms-powerpoint',
                    'application/vnd.openxmlformats-officedocument.presentationml.presentation', 'text/plain'" />
                              </button>
                            </div>
                          </div>
                        </div>

                      </td>
                    </tr>
                 
                  </ng-container>

                  <ng-container *ngIf="action =='Adicionar'">
                    <tr>
                      <td>
                        <div class="TextosBlueLeft">3. Archivo Adjunto<span style="color:red;">* </span></div>
                      </td>
                      <td>
                        <div class="container">
                          <div class="button-wrap">
                            <div>
                              <button class="text-center buttonAr3 btn-file CenterAll">Adjuntar archivo
                                <img style="transform: rotate(180deg)"
                                  src="../.././../../assets/iconos_PAE/PNG/Iconos_PAE-4.png " height="20px"
                                  width="auto">
                                <input name="photo" type="file" data-max-size="3064" required
                                  (change)="onFileSelected($any($event).currentTarget.files)" accept="'image/png', 'image/jpg', 'image/jpeg', 'image/gif', 'image/tiff', 'image/gif',
                    'application/vnd.rar', 'application/zip', 'application/msword',
                    'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                    'application/pdf', 'application/vnd.ms-excel',
                    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','application/vnd.ms-powerpoint',
                    'application/vnd.openxmlformats-officedocument.presentationml.presentation', 'text/plain'" />
                              </button>
                            </div>
                          </div>
                        </div>
                      </td>
                    </tr>
                  </ng-container>
                </table>
              </mat-dialog-content>
              <ng-template #elseTemplate>
                <div style="text-align: center;color: #005ACA;">
                  <br>
                  ¿Está seguro de eliminar el registro?
                  
                </div><br>
              </ng-template>
              <table class="BordeSuperior">
                <ng-container>
                  <div>
                    <div class="CenterButton text-center">
                      <div class="AlignRight">
                        <button [disabled]="!form.valid && action !='Eliminar'" (click)="doAction()">{{action}}
                        </button>
                      </div>
                      <!-- <div>
                        <button [disabled]="!form.valid && action !='Eliminar'" color="accent"  (click)="notificarDialog()">Guardar cambios y notificar a la UAPA</button>
                      </div> -->
                      <div>
                        <button (click)="closeDialog()">Cancelar
                        </button>
                      </div>
                    </div>
                  </div>
                </ng-container>
              </table>
            </mat-card-content>
          </div>
        </div>
      </div>
    </mat-card-content>
  </div>
</div>
