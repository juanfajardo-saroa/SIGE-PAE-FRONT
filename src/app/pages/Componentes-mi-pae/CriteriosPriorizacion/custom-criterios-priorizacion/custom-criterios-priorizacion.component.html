<div style="display:flex; align-items: center; justify-content: left;">
  <div style="float: left; display: inline;">
    <div style="padding: 10px; 
        background-color: #00A9AB;
        padding: 12px 24px 12px 12px; 
        color: #ffffff;
        text-align: center;
        display: inline-block;
        border-radius: 0 30px 30px 0;
        font-family: Poppins;
        font-size: 14px;">
      <b>Criterios de Priorizaci&oacute;n</b>
    </div>
  </div>
  <!-- <span>Criterios de priorización</span> -->
  <button style="margin-left: 20px;" class="BordeRedondoAgregar" mat-raised-button *ngIf="esEdicion"
    (click)="onEditar()" [disabled]="!getModulePermission(90,'editar')">
    <img src="../../../../../assets/iconos_PAE/PNG/Iconos_PAE-3.png" alt="" height="18px" width="auto"
      style="margin-right: 10px;">
    <span style="color: white;">Activar/Desactivar criterios</span>
  </button>
  <button style="margin-left: 20px;" class="BordeRedondoAgregar" mat-raised-button *ngIf="esEdicion"
    (click)="onGuardar()">
    <img src="../../../../../assets/iconos_PAE/PNG/Iconos_PAE-6.png" alt="" height="18px" width="auto"
      style="margin-right: 10px;">
    Guardar cambios
  </button>
</div>
<br />
<table mat-table [dataSource]="criterios">
  <!-- <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let item"> {{item.id}} </td>
  </ng-container> -->
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef class="LeftUpCorner"> <b>Criterios (en orden de prioridad)</b> </th>
    <td mat-cell *matCellDef="let item" style="padding-left: 20px;"> {{item.prioridad}}. {{item.nombre}} </td>
  </ng-container>
  <!--<ng-container matColumnDef="activo">
    <th mat-header-cell *matHeaderCellDef class="LeftUpCorner2"> <b>Activar criterios</b> </th>
    <td mat-cell *matCellDef="let item; let i = index" class="text-center">
       <mat-icon>radio_button_checked</mat-icon> 
      <mat-checkbox [checked]="item.activo" [disabled]="!esEdicion" (change)="selectionChange($event)"
        [value]="item.id"></mat-checkbox>
    </td>

  </ng-container>-->


  <tr mat-header-row *matHeaderRowDef="columnNames"></tr>
  <tr mat-row *matRowDef="let row; columns: columnNames;"></tr>
</table>
<div style="display:flex; align-items: center; justify-content: left;">
  <span style="color:#005ACA; 
  font-family: Poppins; 
  font-size: 14px;
  margin: 10px 0 0 25px;">
    *NOTA: Informe al administrador del sistema si considera necesario cambiar o agregar criterios.</span>
</div>
