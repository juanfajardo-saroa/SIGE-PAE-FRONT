



<div style="display:flex; align-items: center; justify-content: right;">

  <button style="margin-left: 20px;" class="BordeRedondoAgregar" mat-raised-button *ngIf="!esEdicion"
    (click)="onEditar()" [disabled]="!getModulePermission(90,'editar')">
    <img src="../../../../../assets/iconos_PAE/PNG/Iconos_PAE-3.png" alt="" height="18px" width="auto"
      style="margin-right: 10px;">
    <span style="color: white!important;">Editar criterios</span>
  </button>

</div>

<div *ngIf="esEdicion">
  <div class="d-flex flex-column flex-xl-row justify-content-between">
    <span class="ml-lg-down-0" style="color:#005ACA;
    font-family: Poppins;
    font-size: 14px;
    margin: 10px 0 0 25px;">
      Puede cambiar el orden de los criterios arrastrándolos hacia arriba o abajo.</span>


    <button style="margin-left: 20px; float: right;" class="BordeRedondoAgregar ml-lg-down-0 mt-lg-down-10-px" mat-raised-button
      (click)="onGuardar()">
      <img src="../../../../../assets/iconos_PAE/PNG/Iconos_PAE-6.png" alt="" height="18px" width="auto"
        style="margin-right: 10px;">
      Guardar cambios
    </button>
  </div>
</div>


<br>

<table mat-table [dataSource]="dataSource" cdkDropList [cdkDropListData]="dataSource"
  (cdkDropListDropped)="dropTable($event)">
  <!-- <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let item"> {{item.id}} </td>
  </ng-container> -->
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef class="LeftUpCorner" style="border-right: hidden;border-bottom: 1px solid #005ACA!important;"> <b>Criterios (en orden de
        prioridad)</b> </th>
    <td mat-cell *matCellDef="let item" style="padding-left: 20px;">
      <div *ngIf="!esEdicion" style="padding: 0 15px;">
        {{item.prioridad}}. {{item.nombre}}
      </div>

      <div *ngIf="esEdicion">
        <div style="display: flex;">
          <div style="padding: 0 15px;">{{item.prioridad}}.</div>
          <input (change)="onnombreCriterio($any($event).target.value, item)" matInput id="nombreCriterio"
            value={{item.nombre}} placeholder="Digite criterio" class="form-control" style="float: left;" />
        </div>
      </div>
    </td>
  </ng-container>

  <ng-container matColumnDef="activo">
    <th mat-header-cell *matHeaderCellDef class="LeftUpCorner2"
      style="width: 10px!important; border-left: hidden!important;border-bottom: 1px solid #005ACA!important;"></th>
    <td mat-cell *matCellDef="let item" style="padding-left: 20px;">
      <div *ngIf="esEdicion" style="display:flex; justify-content: center;">
        <img (click)="Eliminar(item)" src="../.././../../assets/iconos_PAE/PNG/Iconos_PAE-53.png "
          style="width:30px; height: 30px; margin-top: 10px;cursor: pointer;">
      </div>
    </td>
    <!-- <td mat-cell *matCellDef="let item; let i = index" class="text-center"> -->
    <!-- <mat-icon>radio_button_checked</mat-icon> -->
    <!--   <mat-checkbox [checked]="item.activo" [disabled]="!esEdicion" (change)="selectionChange($event)"
        [value]="item.id"></mat-checkbox>
    </td> -->
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnNames"></tr>
  <tr mat-row *matRowDef="let row; columns: columnNames;" cdkDrag [cdkDragData]="row"></tr>
</table>
<br>
<div fxLayout="row wrap" *ngIf="esEdicion">
  <div fxFlex="100">
    <div fxLayout="row wrap" class="align-items-center">
      <div fxFlex.gt-md="75" class="text-right">
        <a class="btn-registrar" (click)="openDialog('Add',{})"><img
            src="../.././../assets/images//Iconos/add_blue.png"> Agregar criterio</a>
      </div>
    </div>
  </div>
</div>
