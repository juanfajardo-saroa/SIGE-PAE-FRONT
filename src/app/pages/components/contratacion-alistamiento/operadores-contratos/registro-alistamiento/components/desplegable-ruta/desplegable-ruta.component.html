<main class="mt-3">
  <mat-accordion >
    <mat-expansion-panel   hideToggle (opened)="panelAbierto = true" (closed)="panelAbierto = false">
      <mat-expansion-panel-header [ngClass]="panelAbierto ? 'abierto' : 'cerrado'">
        <mat-panel-title class="d-flex align-items-center" [ngClass]="panelAbierto ? 'abierto' : 'cerrado'">
          <img src="/assets/iconos_PAE/PNG/Iconos_PAE-73.png" [ngClass]="panelAbierto ? 'img--abierto' : 'img--cerrado'"
            alt="icono transporte" />
          <span class="mx-3">Ruta {{ numRuta }} | Sedes {{ sedesRuta }}</span>
        </mat-panel-title>
        <span class="material-icons" [ngClass]="panelAbierto ? 'icono--abierto' : 'icono--cerrado'">
          arrow_drop_down
        </span>
      </mat-expansion-panel-header>

      <section class="container px-3 panel__body mt-3">
        <div class="d-grid gap-2 d-md-flex justify-content-md-end d-flex flex-column flex-xl-row gap-down-10-px">
          <button class="btn btn-primary me-md-2 mx-0 mx-xl-3" (click)="editarRuta()" [disabled]="modoEdicionRuta" [ngClass]="{'linkdisable':!getModulePermission(73,'editar')}">
            <img src="/assets/iconos_PAE/PNG/Iconos_PAE-3.png" width="16px" alt="icono editar" class="mx-1" />Editar
            ruta
          </button>
          <button class="btn btn-primary" (click)="eliminarRuta()" [ngClass]="{'linkdisable':!getModulePermission(73,'eliminar')}">
            <img src="/assets/iconos_PAE/PNG/Iconos_PAE-53.png" width="25px" alt="icono eliminar" />Eliminar ruta
          </button>
        </div>
        <app-informacion-ruta [modoEdicion]="modoEdicionRuta" [sedesPorAsignar]="sedesPorAsignar"
          [infoSedesRuta]="infoSedesRuta" [productosRuta]="productosRuta" (cambiarModoVista)="modoVerInformacionRuta($event)"
          (infoRutas)="guardarRuta($event)" (infoProductos)="guardarProductosRuta($event)"></app-informacion-ruta>
      </section>
    </mat-expansion-panel>
  </mat-accordion>
</main>
