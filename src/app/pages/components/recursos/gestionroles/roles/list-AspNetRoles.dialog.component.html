<div *ngIf="loading">
  <app-spinner></app-spinner>
</div>

<div class="SizeDialog">

  <mat-card-header class="TituloDialog">
    <ng-container>
      <div mat-dialog-actions>
        <tr class="CenterButton">
          <td>
            <strong>{{ action }} rol</strong>
          </td>
        </tr>
      </div>
    </ng-container>
  </mat-card-header>
</div>
<div class="course-app" *ngIf="!loading">
  <div class="example-form" [formGroup]="form" (ngSubmit)="doAction()">
    <mat-card-content>
      <div fxLayout="row wrap" class="course-app">
        <div fxFlex.gt-md="100" fxFlex.gt-lg="100" fxFlex="100">
          <div>
            <mat-card-content class="text-center">
              <mat-dialog-content class="mat-typography" *ngIf="action != 'Eliminar'; else elseTemplate">
                <br />
                <div *ngIf="action !='Adicionar'">
                  <div class="example-full-width">
                    <br />
                    <input id="id" formControlName="id" readonly="true" class=" form-control"
                      style="display: none;" />
                  </div>
                </div>
                <table>
                  <ng-container>
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">1. Nombre<span style="color:red;">* </span> </div>
                      </td>
                      <td class="BordeSeparador">
                        <br />




                        <input [disabled]="disableForm" type="text" id="name" formControlName="name" class="form-control"/>




                      </td>
                    </tr>
                  </ng-container>
                  <br>
                  <ng-container>
                    <tr>
                      <td class="BordeSeparador">
                        <div class="TextosBlueLeft">2. Tipo de rol<span style="color:red;">* </span></div>
                      </td>
                      <td class="BordeSeparador">




                          <mat-select [disabled]="disableForm" id="id_TipoRoles" class="control-md tablaform" formControlName="id_TipoRoles">
                            <mat-option *ngFor="let item of TipoRolesList" [value]="item.id">{{item.nombre}}
                            </mat-option>
                          </mat-select>
                      </td>
                    </tr>
                  </ng-container>
                  <br>

                </table>
                <br>
                <div class="responsive-table-pae" *ngFor="let sistema of SistemasList">
                  <div style="width: 100%; float: left;">
                    <div class="titletable" style="    margin-left: 29px;
                    margin-top: 10px;">{{sistema}}</div>
                  </div>
                  <table mat-table [dataSource]="permisosBySistema[sistema].permisos" class="right-radius">
                    <ng-container matColumnDef="modulo">
                      <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 12%; align-items: center; border-bottom: #005ACA 1px solid;color: #005ACA;background-color: #E2ECFD;"><b>Módulo</b></th>
                      <td class="w-down-100" mat-cell *matCellDef="let row" style="padding-left: 0px; width: 12%; text-align: center; " data-label="Módulo">
                        {{row.modulo}}
                      </td>
                    </ng-container>
                    <ng-container matColumnDef="ver">
                      <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 10%; border-bottom: #005ACA 1px solid;color: #005ACA;background-color: #E2ECFD;"><b>Ver</b></th>
                      <td class="w-down-100" mat-cell *matCellDef="let row" style="padding-left: 0px; width: 10%; text-align: center;" data-label="Ver">
                        <mat-checkbox class="example-margin" [checked]="row.ver" [disabled]="action=='Ver'" (change)="valueChange(row.id_Modulo, sistema, 'ver',$event)"></mat-checkbox>
                      </td>
                    </ng-container>
                    <ng-container matColumnDef="crear">
                      <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 10%; border-bottom: #005ACA 1px solid;color: #005ACA;background-color: #E2ECFD; "><b>Crear</b></th>
                      <td class="w-down-100" mat-cell *matCellDef="let row" style="padding-left: 0px; width: 10%; text-align: center;" data-label="Crear">
                        <mat-checkbox class="example-margin" [checked]="row.crear" [disabled]="action=='Ver'" (change)="valueChange(row.id_Modulo, sistema, 'crear',$event)"></mat-checkbox>
                      </td>
                    </ng-container>
                    <ng-container matColumnDef="editar">
                      <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 10%; border-bottom: #005ACA 1px solid;color: #005ACA;background-color: #E2ECFD;"><b>Editar</b></th>
                      <td class="w-down-100" mat-cell *matCellDef="let row" style="padding-left: 0px; width: 10%; text-align: center;" data-label="Editar">
                        <mat-checkbox class="example-margin" [checked]="row.editar" [disabled]="action=='Ver'" (change)="valueChange(row.id_Modulo, sistema, 'editar',$event)"></mat-checkbox>
                      </td>
                    </ng-container>
                    <ng-container matColumnDef="eliminar">
                      <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 10%; border-bottom: #005ACA 1px solid;color: #005ACA;background-color: #E2ECFD;"><b>Eliminar</b></th>
                      <td class="w-down-100" mat-cell *matCellDef="let row" style="padding-left: 0px; width: 10%; text-align: center;" data-label="Eliminar">
                        <mat-checkbox class="example-margin" [checked]="row.eliminar" [disabled]="action=='Ver'" (change)="valueChange(row.id_Modulo, sistema, 'eliminar',$event)">
                        </mat-checkbox>
                      </td>
                    </ng-container>
                    <ng-container matColumnDef="aprobar">
                      <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 10%; border-bottom: #005ACA 1px solid;color: #005ACA;background-color: #E2ECFD;"><b>Aprobar</b></th>
                      <td class="w-down-100" mat-cell *matCellDef="let row" style="padding-left: 0px; width: 10%; text-align: center;" data-label="Aprobar">
                        <mat-checkbox class="example-margin" [checked]="row.aprobar" [disabled]="action=='Ver'" (change)="valueChange(row.id_Modulo, sistema, 'aprobar',$event)"></mat-checkbox>
                      </td>
                    </ng-container>
                    <ng-container matColumnDef="imprimir">
                      <th mat-header-cell *matHeaderCellDef class="EspacioImpri" style="padding-left: 0px; width: 10%; align-items: center; border-bottom: #005ACA 1px solid; align-items: center;color: #005ACA;background-color: #E2ECFD;"><b>Imprimir</b></th>
                      <td class="w-down-100" mat-cell *matCellDef="let row" style="padding-left: 0px; width: 10%; text-align: center; " data-label="Imprimir">
                        <mat-checkbox class="example-margin" [checked]="row.imprimir" [disabled]="action=='Ver'" (change)="valueChange(row.id_Modulo, sistema, 'imprimir',$event)">
                        </mat-checkbox>
                      </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                  </table>
                </div>

              </mat-dialog-content>
              <ng-template #elseTemplate>
                <br>
                <div style="text-align: center;">
                  ¿Está seguro de eliminar el registro?
                </div>
                <br>
              </ng-template>
              <table class="BordeSuperior">
                <ng-container>
                  <div>
                    <div class="CenterButton text-center">
                      <div class="AlignRight">
                        <button [disabled]="!form.valid && action !='Eliminar'" (click)="doAction()">{{action}}
                        </button>
                      </div>
                      <div>
                        <button (click)="closeDialog()">Cancelar
                        </button>
                      </div>
                    </div>
                  </div>
                </ng-container>
              </table>
            </mat-card-content>
          </div>
        </div>
      </div>
    </mat-card-content>
  </div>
</div>
