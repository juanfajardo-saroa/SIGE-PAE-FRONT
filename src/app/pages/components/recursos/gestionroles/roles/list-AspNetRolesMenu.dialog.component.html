<div *ngIf="loading">
  <app-spinner></app-spinner>
</div>

<div class="SizeDialog">

  <mat-card-header class="TituloDialog">
    <ng-container>
      <div mat-dialog-actions>
        <tr class="CenterButton">
          <td>
            <strong>Activar menus</strong>
          </td>
        </tr>
      </div>
    </ng-container>
  </mat-card-header>
</div>
<div class="course-app" *ngIf="!loading">
  <div class="example-form">
    <mat-card-content>
      <div fxLayout="row wrap" class="course-app">
        <div fxFlex.gt-md="100" fxFlex.gt-lg="100" fxFlex="100">
          <div>
            <mat-card-content class="text-center">
              <mat-dialog-content class="mat-typography">
                <br><br>
                <table mat-table [dataSource]="dataSourceMenuRol" class="left-radius right-radius">
                  <ng-container matColumnDef="menu">
                    <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 18%; ">Menu</th>
                    <td mat-cell *matCellDef="let row" style="padding-left: 0px; width: 18%; text-align: center;">
                      {{row.menu}}
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="estado">
                    <th mat-header-cell *matHeaderCellDef style="padding-left: 0px; width: 18%; ">Estado</th>
                    <td mat-cell *matCellDef="let row" style="padding-left: 0px; width: 18%; text-align: center;">
                      <mat-checkbox class="example-margin" [checked]="row.estado"
                        (change)="valueChange(row, $event)"></mat-checkbox>
                    </td> 
                  </ng-container>
                
                  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
                <br><br>
              </mat-dialog-content>
              <table class="BordeSuperior">
                <ng-container>
                  <div>
                    <div class="CenterButton text-center">
                      <div class="AlignRight">
                        <button (click)="doAction()">Aceptar
                        </button>
                      </div>
                      <div>
                        <button (click)="closeDialog()">Cancelar
                        </button>
                      </div>
                    </div>
                  </div>
                </ng-container>
              </table>
            </mat-card-content>
          </div>
        </div>
      </div>
    </mat-card-content>
  </div>
</div>
