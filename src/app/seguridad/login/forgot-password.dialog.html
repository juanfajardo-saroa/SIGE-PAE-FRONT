<div class="SizeDialog">
  <div class="text-center">
    <img alt="homepage" src="../../assets/images/LogoAlimentos.png" height="50%" width="50%">
  </div>
  <br>
  <div class="bordeContra">
    <mat-card-header class="TituloDialog">
      <ng-container>
        <div mat-dialog-actions>
          <div class="d-flex flex-column w-100">
            <span>Ingrese su correo electrónico registrado para recibir</span>
            <span>un mensaje de <strong>recuperación de contraseña</strong>:</span>
          </div>
        </div>
      </ng-container>
    </mat-card-header>

    <div class="example-form" [formGroup]="forgotPasswordForm" (ngSubmit)="doAction()">

      <div fxLayout="row wrap" class="course-app">
        <div fxFlex.gt-md="100" fxFlex.gt-lg="100" fxFlex="100">
          <div>
            <mat-card-content class="text-center">
              <mat-dialog-content class="mat-typography d-flex flex-column align-items-center pt-2">

                <div class="d-flex w-50 w-down-sm-75">
                  <input matInput type="text" id="email" formControlName="email" class="form-control" />
                </div>

              </mat-dialog-content>

              <div class="d-flex flex-sm-row flex-column justify-content-center py-4 gap-20-px">
                <div class="mx-3">
                  <button class="btn btn-block my-0 my-sm-3" (click)="closeDialog()" style="background-color: #E2ECFD; color: #005ACA; border-color: #E2ECFD;">Cancelar
                  </button>
                </div>
                <div class="mx-3">
                  <button class="btn btn-block my-0 my-sm-3" [disabled]="!forgotPasswordForm.valid" (click)="doAction()">{{action}} mensaje
                  </button>
                </div>
              </div>

            </mat-card-content>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
